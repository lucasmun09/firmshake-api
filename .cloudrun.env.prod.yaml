# Prod Cloud Run env (firmshake-prod / us-east1).
# Fill after creating the GCP project — see firmshake docs/devo-prod-stacks.md.
# Do NOT copy deovo Typesense hosts/keys. Do NOT enable Stripe live keys yet.

FLASK_DEBUG: 'false'
FIREBASE_PROJECT_ID: firmshake-prod
GCS_BUCKET: firmshake-prod-images
# Prod CORS only — custom domain + both Firebase Hosting hostnames. No control panel, no firmshake-dev.
CORS_ORIGINS: 'https://firm-shake.com,https://www.firm-shake.com,https://firmshake-prod.web.app,https://firmshake-prod.firebaseapp.com,capacitor://localhost,ionic://localhost'
CONTROLPANEL_BOOTSTRAP_EMAILS: ''
RECAPTCHA_SITE_KEY: 'REPLACE_ME_PROD_RECAPTCHA_SITE_KEY'
RECAPTCHA_PROJECT_ID: firmshake-prod
RECAPTCHA_MIN_SCORE: '0.5'
# No payment processor this phase — keep false; do not add Stripe keys.
PAYMENTS_ENABLED: 'false'
# STRIPE_PAYMENTS_ENABLED: 'false'
# Typesense — SEPARATE prod cluster/database (never reuse deovo host/keys).
# TYPESENSE_HOST: 'https://YOUR-PROD-TYPESENSE-HOST'
# TYPESENSE_API_KEY: 'YOUR-PROD-SEARCH-ONLY-KEY'
# TYPESENSE_LISTINGS_COLLECTION: 'listings'
