name: Deploy API

# Promote: merge to main → deovo → smoke → prod (on green).
# See firmshake/docs/devo-prod-stacks.md.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "Deploy target (full = deovo→smoke→prod)"
        required: true
        default: full
        type: choice
        options:
          - full
          - deovo
          - prod

concurrency:
  group: deploy-api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unit_tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [[ -f requirements-dev.txt ]]; then pip install -r requirements-dev.txt; fi
      - name: Pytest
        run: pytest -q

  deploy_devo:
    name: Deploy deovo
    needs: unit_tests
    if: >
      needs.unit_tests.result == 'success' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && (inputs.target == 'full' || inputs.target == 'devo')))
    runs-on: ubuntu-latest
    environment: deovo
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: firmshake-dev
      REGION: us-central1
      SERVICE: firmshake-api-staging
      REPOSITORY: firmshake
      GCS_BUCKET: firmshake-dev-images
    steps:
      - uses: actions/checkout@v4

      - name: Assert deovo Cloud Run env
        run: bash scripts/assert-cloudrun-env.sh deovo .cloudrun.env.yaml

      # TODO(wif): replace credentials_json with workload_identity_provider + service_account
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push
        run: |
          IMAGE=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/api:${{ github.sha }}
          docker build --platform linux/amd64 -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}
          env_vars_file: .cloudrun.env.yaml
          flags: >-
            --allow-unauthenticated
            --port=8080
            --memory=512Mi

  smoke_devo:
    name: Smoke deovo API
    needs: deploy_devo
    if: >
      always() &&
      needs.deploy_devo.result == 'success' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.target == 'full'))
    runs-on: ubuntu-latest
    environment: deovo
    steps:
      - uses: actions/checkout@v4
      - name: Health check (stack identity + payments flag)
        run: |
          URL="${{ secrets.API_BASE_URL || 'https://firmshake-api-staging-858269838319.us-central1.run.app' }}"
          bash scripts/smoke-health.sh "$URL" deovo

  deploy_prod:
    name: Deploy prod
    needs: [deploy_devo, smoke_devo]
    # Soft gate: set repo variable PROD_DEPLOY_ENABLED=true after firmshake-prod + Environment `prod` secrets exist.
    if: >
      always() &&
      vars.PROD_DEPLOY_ENABLED == 'true' &&
      (
        (github.event_name == 'push' && needs.smoke_devo.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.target == 'prod') ||
        (github.event_name == 'workflow_dispatch' && inputs.target == 'full' && needs.smoke_devo.result == 'success')
      )
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: firmshake-prod
      REGION: us-east1
      SERVICE: firmshake-api
      REPOSITORY: firmshake
    steps:
      - uses: actions/checkout@v4

      - name: Assert prod Cloud Run env (no deovo cross-wire / payments off)
        run: bash scripts/assert-cloudrun-env.sh prod .cloudrun.env.prod.yaml

      # TODO(wif): replace credentials_json with workload_identity_provider + service_account
      # Requires firmshake-prod + GitHub Environment `prod` secret GCP_SA_KEY (or WIF).
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push
        run: |
          IMAGE=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/api:${{ github.sha }}
          docker build --platform linux/amd64 -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}
          env_vars_file: .cloudrun.env.prod.yaml
          flags: >-
            --allow-unauthenticated
            --port=8080
            --memory=512Mi
